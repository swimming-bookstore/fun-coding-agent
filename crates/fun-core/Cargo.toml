[package]
name = "fun-core"
version = "0.1.0"
edition = "2024"
description = "Shared Fun coding agent: Grok client, tools, sessions, config"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
provider-grok = { path = "../provider-grok" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
