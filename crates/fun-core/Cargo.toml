[package]
name = "fun-core"
version = "0.1.0"
edition = "2024"
description = "Shared Fun coding agent: providers, tools, sessions, config"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
provider-grok = { path = "../provider-grok" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
