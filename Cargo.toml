[workspace]
members = [".", "crates/fun-core", "crates/provider-grok"]
resolver = "3"

[package]
name = "fun-coding-agent"
version = "0.1.0"
edition = "2024"
description = "Fun coding agent"
default-run = "fun"

[[bin]]
name = "fun"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
fun-core = { path = "crates/fun-core" }
provider-grok = { path = "crates/provider-grok" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
unicode-width = "0.2"
pulldown-cmark = "0.13"
