[package]
name = "fun-coding-agent"
version = "0.1.0"
edition = "2024"
description = "Fun coding agent"
default-run = "fun"

[[bin]]
name = "fun"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
provider-grok = { path = "../provider-grok" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
pulldown-cmark = "0.13"
