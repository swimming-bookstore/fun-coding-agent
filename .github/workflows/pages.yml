# Build the mdBook and deploy to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pin the image. ubuntu-latest moved to Ubuntu 26 on 2026-10-19 and the
    # Pages deploy that followed hung until GitHub aborted it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - run: mdbook build
        working-directory: book
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 20
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        timeout-minutes: 15
